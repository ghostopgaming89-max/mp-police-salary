<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>MP Police Salary Software</h1>

    <h2>Employee Entry Form</h2>

    <table>

        <tr>
            <td>BNO</td>
            <td><input type="text" id="bno"></td>

            <td>Unicode</td>
            <td><input type="text" id="unicode"></td>
        </tr>

        <tr>
            <td>Name</td>
            <td><input type="text" id="name"></td>

            <td>Rank</td>
            <td><input type="text" id="rank"></td>
        </tr>

        <tr>
            <td>PRAN No.</td>
            <td><input type="text" id="pran"></td>

            <td>Basic Pay</td>
            <td><input type="number" id="basic"></td>
        </tr>

        <tr>
            <td>Posting</td>
            <td><input type="text" id="posting"></td>

            <td>Mobile</td>
            <td><input type="text" id="mobile"></td>
        </tr>

        <tr>
            <td colspan="4" style="text-align:center; padding-top:15px;">
                <button>Save</button>
                <button>Update</button>
                <button>Delete</button>
                <button>Search</button>
            </td>
        </tr>

    </table>

</div>

</body>
</html>
