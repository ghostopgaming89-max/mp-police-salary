```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MP Police Salary Software</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <div class="logo">

            <div class="logo-circle">
                MP
            </div>

            <h1>MP Police Salary Software</h1>

            <p>Payroll Management System</p>

        </div>


        <div class="login-form">

            <label>User Name</label>

            <input
                type="text"
                id="txtUser"
                placeholder="Enter User Name"
                autocomplete="username">


            <label>Password</label>

            <input
                type="password"
                id="txtPassword"
                placeholder="Enter Password"
                autocomplete="current-password">


            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#" onclick="return false;">
                    Forgot Password?
                </a>

            </div>


            <button id="btnLogin">
                LOGIN
            </button>

        </div>


        <div class="footer">

            Version 1.0
            <br>
            Developed By SRK

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
